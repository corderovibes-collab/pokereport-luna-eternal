# Compila el launcher para Windows y macOS.
#
# POR QUE HACE FALTA ESTO
#
# Un `.dmg` de macOS **solo se puede construir desde un Mac**: electron-builder
# necesita herramientas de Apple (`hdiutil`, `codesign`) que no existen en
# Windows. Sin un Mac a mano, la unica via es un runner de GitHub, que si lo es.
#
# De paso queda reproducible: cualquiera puede ver con que se compilo cada
# version en vez de depender de que alguien lo hiciera bien en su portatil.
#
# COMO SE USA
#
#   1. Etiquetar la version:   git tag launcher-v1.2.3 && git push --tags
#   2. Esperar unos minutos
#   3. Los instaladores quedan en la release del repositorio
#
# Tambien se puede lanzar a mano desde la pestana Actions (`workflow_dispatch`).

name: Launcher

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:

permissions:
  contents: write        # necesario para crear la release y subir los ficheros

jobs:
  build:
    strategy:
      # `fail-fast: false` a proposito: si falla Mac quiero ver igualmente si
      # Windows compilo, en vez de quedarme sin ninguno de los dos.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          # `macos-latest` es Apple Silicon. Compila los dos DMG (x64 y arm64)
          # porque electron-builder hace cross-compile entre arquitecturas del
          # mismo sistema sin problema; entre sistemas distintos no.
          - os: macos-latest
            nombre: mac

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nombre }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Instalar dependencias
        working-directory: launcher
        run: npm ci

      - name: Comprobar plataforma
        working-directory: launcher
        # Barato y atrapa justo lo que mas duele: elegir mal los natives segun
        # la arquitectura deja el juego sin arrancar y sin decir por que.
        run: node prueba-plataforma.mjs

      - name: Compilar
        working-directory: launcher
        env:
          # Sin certificado de Apple. Sin esto, electron-builder intenta firmar
          # y aborta en un runner limpio.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.nombre }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.dmg
          if-no-files-found: error

  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Instalación

            **Windows** — descarga el `.exe`. SmartScreen avisará la primera
            vez: *Más información* → *Ejecutar de todas formas*.

            **macOS** — descarga el `.dmg` que corresponda:

            | Tu Mac | Fichero |
            |---|---|
            | Apple Silicon (M1, M2, M3, M4) | `-arm64.dmg` |
            | Intel | `-x64.dmg` |

            Si no sabes cuál tienes: menú Apple → *Acerca de este Mac*.

            La primera vez macOS lo bloqueará por no estar firmado. Ábrelo con
            **clic derecho → Abrir** y confirma. Solo hace falta una vez.
